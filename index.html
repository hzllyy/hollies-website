<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Holly's Website</title>

    <link rel="stylesheet" href="styles.css">

    <!-- animate on scroll library -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- anonymous pro font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link rel="preload" as="image" href="images/portfolio_bg.PNG">
    <link rel="preload" as="image" href="images/portfolio_screen.PNG">
    <link rel="preload" as="image" href="images/window.png">
    <link rel="preload" as="image" href="images/computer.PNG">
    <link rel="preload" as="image" href="images/window-extender.png">
    <link rel="preload" as="image" href="images/hi.png">
    <link rel="preload" as="image" href="images/iama.png">
    <link rel="preload" as="image" href="images/logo-left.PNG">
    <link rel="preload" as="image" href="images/creator.png">
    <link rel="preload" as="image" href="images/developer.png">
    <link rel="preload" as="image" href="images/designer.png">


</head>
<body>
    <img src="images/portfolio_screen.PNG" id="screen" alt="screen" loading="lazy">

    <div class="bg-wrapper">
        <img src="images/portfolio_bg.PNG" id="bg" alt="background" loading="lazy">
    </div>

    <div class="hi-wrapper">
        <img src="images/hi.png" id="hi" alt="hi" loading="lazy">
    </div>
    
    <div class="window-wrapper">
        <img src="images/window.png" id="window" alt="window" loading="lazy">
    </div>
    
    <div class="extender-wrapper">
        <img src="images/window-extender.png" id="extend" alt="extend" loading="lazy">
    </div>

    <div class="iama-wrapper">
        <img src="images/iama.png" id="iama" alt="iama" loading="lazy">
    </div>
    
    <div class="logo-wrapper">
        <img src="images/logo-left.PNG" id="logo" alt="logo" loading="lazy">
    </div>

    <div class="projects-view">
        <button class="exit-btn">x</button>
        <div class="project-book">
            <button class="left-btn disabled"><</button>
            <img src="images/cover_page.PNG" alt="book" class="book" loading="lazy">
            <button class="right-btn">></button>
        </div>
    </div>

    <div class="grain"></div>

    <div class="contact">
        <div class="contact-me">
            <img src="images/connect.PNG" alt="connect-me" class="contact-bg" loading="lazy">
            <img src="images/envelope-back.PNG" alt='envelope-back' class="envelope-back" loading="lazy">
            <div class="lets-connect-wrapper">
                <div class="lets-connect">
                    <img src="images/notecard.PNG" alt="notecard" class="notecard" loading="lazy">
                    <form 
                        id="form"
                        action="https://formspree.io/f/xwvvndgq"
                        method="POST"
                    > 
                        <h1>Let's Connect!</h1>
                        <input type="text" id="name" name="name" placeholder="Name" class="small">
                        <input type="text" id="email" name="email" placeholder="E-mail" class="small">
                        <textarea rows="4" id="message" name="message" placeholder="Message"></textarea>
                        <input type="submit" value="send" id="form-submit">
                    </form>
                </div>
            </div>
            
            <img src="images/envelope.PNG" alt="envelope" class="envelope" loading="lazy">
        </div>
    </div>

    <div class="sent-msg">
        <img src="images/sent_message.png" alt="message-sent" loading="lazy">
        <p class="msg-exit-btn">x</p>
    </div>
    
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
